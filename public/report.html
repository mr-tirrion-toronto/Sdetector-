<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Security Assessment · Scam Detector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172536;font:14px/1.55 Inter,Arial,sans-serif}.toolbar{max-width:900px;margin:22px auto 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 18px}.toolbar button{border:0;background:#0e766e;color:white;padding:12px 17px;border-radius:9px;font-weight:700;cursor:pointer}.toolbar a{color:#40566d;text-decoration:none;font-size:12px}.sheet{width:min(850px,calc(100% - 28px));margin:0 auto 40px;background:#fff;box-shadow:0 12px 48px #17253618;padding:48px 54px;min-height:1000px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid #0e766e;padding-bottom:24px}.brand{font-size:13px;font-weight:900;letter-spacing:.12em;color:#0e766e}.brand small{display:block;font-size:9px;letter-spacing:.16em;color:#6c7f91;margin-top:4px}.report-label{text-align:right;color:#617386;font-size:10px;letter-spacing:.12em;font-weight:800}.title{margin:30px 0 8px;font-size:30px;letter-spacing:-.04em}.subtitle{color:#65778a;margin:0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.meta div{background:#f3f7f8;padding:13px 15px;border-radius:8px;min-width:0}.meta small{display:block;color:#6c7e8f;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.meta strong{display:block;margin-top:4px;overflow-wrap:anywhere;font-size:12px}.verdict{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;padding:20px;border:1px solid #dce5e9;border-radius:12px;margin:20px 0}.score{font-size:35px;font-weight:900;letter-spacing:-.05em;color:#0e766e}.score small{display:block;font-size:9px;letter-spacing:.12em;color:#65778a}.verdict h2{margin:0 0 5px;font-size:17px}.verdict p{margin:0;color:#65778a;font-size:12px}.section{margin-top:28px}.section h2{font-size:14px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #e1e8ed}.finding{padding:13px 0;border-bottom:1px solid #edf1f4}.finding:last-child{border-bottom:0}.finding-head{display:flex;justify-content:space-between;gap:12px}.finding strong{font-size:12px}.tag{font-size:9px;text-transform:uppercase;font-weight:800;letter-spacing:.08em;border-radius:20px;padding:3px 8px;background:#edf2f6;color:#52677b;white-space:nowrap}.tag.high{background:#fff0f1;color:#b52c42}.tag.medium{background:#fff6e6;color:#9a6514}.tag.low{background:#eef5ff;color:#38689f}.finding p{font-size:11px;color:#52677b;margin:5px 0}.finding b{color:#263d50}.empty{font-size:12px;color:#64788b;background:#f6f8fa;padding:14px;border-radius:8px}.recommend{background:#edf7f5;border-left:3px solid #0e766e;padding:15px 17px;border-radius:7px;color:#355d59;font-size:12px}.limitations{font-size:10px;color:#687b8d;padding-left:18px}.footer{margin-top:40px;padding-top:16px;border-top:1px solid #dfe6eb;display:flex;justify-content:space-between;gap:15px;color:#8090a0;font-size:9px}.error{padding:50px 0;text-align:center;color:#53677b}
@media(max-width:600px){.sheet{padding:28px 22px}.title{font-size:24px}.verdict{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.toolbar{align-items:flex-start}.top{flex-direction:column}.report-label{text-align:left}}
@page{size:A4;margin:14mm}@media print{body{background:#fff}.toolbar{display:none}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}.finding,.meta div,.verdict,.recommend{break-inside:avoid}.section{break-inside:avoid}.footer{position:static}}
</style></head><body>
<div class="toolbar"><a href="/">← Return to Scam Detector</a><button onclick="window.print()">Print / Save as PDF</button></div>
<main class="sheet" id="report"><div class="error">Preparing your security assessment…</div></main>
<script>
const root=document.getElementById('report');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={business_claims_need_verification:'Business / operator needs verification',known_threat_detected:'Known threat match',no_known_threat_match:'No known threat match',threat_intel_partial:'Partial threat intelligence',threat_intel_unavailable:'Threat intelligence unavailable',insufficient_evidence:'Insufficient evidence',preliminary_signals_detected:'Preliminary URL signals detected'};
try{
 const data=JSON.parse(sessionStorage.getItem('scamDetectorReport')||'null');
 if(!data)throw new Error('No report data was found. Return to the scanner and generate a new report.');
 const findings=Array.isArray(data.findings)?data.findings:[];
 const assessment=labels[data.assessmentStatus]||'Preliminary assessment';
 const riskCategory=String(data.riskCategory||(data.assessmentStatus==='known_threat_detected'?'confirmed_threat':Number(data.score)>=70?'critical':Number(data.score)>=40?'high':Number(data.score)>=20?'suspicious':'low'));
 const riskLabels={confirmed_threat:'CONFIRMED THREAT',critical:'CRITICAL RISK',high:'HIGH RISK',suspicious:'SUSPICIOUS',low:'LOW RISK'};
 const level=riskLabels[riskCategory]||'RISK UNDER REVIEW';
 const riskText=data.assessmentStatus==='business_claims_need_verification'?'The page contains business, earnings or parked-domain signals that require independent verification. No payout or company legitimacy has been established.':data.assessmentStatus==='known_threat_detected'?'A matching indicator was found in a configured threat-intelligence source. Do not visit or interact with this website.':data.assessmentStatus==='no_known_threat_match'?'No exact match was found in the configured threat feeds. This does not prove the website is safe.':'The scanner found URL-pattern evidence only. This assessment is not a definitive verdict.';
 const feed=data.threatIntelligence||{};
 const di=data.domainIntelligence||{};
 const dv=di.verdict||{};
 const rg=di.registration||{};
 const inf=di.infrastructure||{};
 const camp=di.campaign||{};
 const live=data.liveInspection||{};
 const dns=live.dns||{};const dnsData=dns.data||{};
 const cert=live.certificateTransparency||{};const certData=cert.data||{};
 const tls=live.tls||{};const tlsData=tls.data||{};
 const reg=live.registration||{};const regData=reg.data||{};
 const page=live.websiteContent||{};const pageData=page.data||{};
 const evidence=data.independentEvidence||{};const relationship=evidence.relationshipIntelligence||{};
 const indicatorLabels={password_input:"Password field detected",form_detected:"Form detected",credential_verification_language:"Credential or one-time-code wording",crypto_wallet_or_secret_request:"Crypto wallet or recovery-secret wording",urgent_account_pressure:"Urgent account-pressure wording",prize_or_financial_lure:"Prize or financial-lure wording",payment_data_language:"Payment-data wording"};
 const brand=data.brandAssessment||{matches:[]};
 const dna=data.scamDna||{};
 const graph=data.relationshipGraph||{nodes:[],edges:[]};
 const change=data.changeMonitoring||{};
 const advancedSection='<section class="section"><h2>Advanced intelligence · Scam DNA & brand impersonation</h2><div class="empty">Family: <b>'+esc(dna.familyLabel||'Not classified')+'</b><br>Fingerprint: '+esc(dna.fingerprint||'Not available')+'<br>Interpretation: '+esc(dna.interpretation||'No family interpretation available.')+'</div>'+
 (brand.matches?.length?brand.matches.map(match=>'<article class="finding"><div class="finding-head"><strong>Possible '+esc(match.brand)+' impersonation</strong><span class="tag '+esc(match.confidence)+'">'+esc(match.confidence)+'</span></div><p>'+esc(match.evidence)+'</p><p><b>Expected official domains:</b> '+esc(match.officialDomains.join(', '))+'</p></article>').join(''):'<div class="empty">No match in the current curated brand registry. This does not establish authenticity.</div>')+
 '<div class="empty">Tracked change status: <b>'+esc(change.status||'history unavailable')+'</b>. '+esc(change.note||'A baseline and advanced database storage are required for change history.')+(change.changedFields?.length?' Changed fields: '+esc(change.changedFields.join(', '))+'.':'')+'</div></section>'+
 '<section class="section"><h2>Relationship intelligence graph</h2><div class="empty">'+Number(graph.nodes?.length||0)+' nodes · '+Number(graph.edges?.length||0)+' evidence-backed relationships.</div>'+
 (graph.edges?.length?graph.edges.map(edge=>'<article class="finding"><div class="finding-head"><strong>'+esc(edge.from.replace(/^(host|domain|ip|cert|threat|campaign|brand):/,''))+' → '+esc(edge.to.replace(/^(host|domain|ip|cert|threat|campaign|brand):/,''))+'</strong><span class="tag">'+esc(edge.confidence)+' confidence</span></div><p><b>'+esc(edge.type.replace(/_/g,' '))+'</b> · '+esc(edge.source)+'</p><p>'+esc(edge.evidence)+'</p><p>'+esc(edge.interpretation)+'</p></article>').join(''):'<div class="empty">No supported infrastructure or campaign relationships were returned.</div>')+
 '<div class="empty">Shared IPs, certificates, CDNs or hosting do not prove common ownership. Relationship data is an investigation lead, not attribution.</div></section>';
 root.innerHTML='<div class="top"><div class="brand">SCAM DETECTOR<small>WEBSITE RISK INTELLIGENCE</small></div><div class="report-label">SECURITY ASSESSMENT<br>CONFIDENTIAL · USER-GENERATED</div></div>'+
 '<h1 class="title">Website Security Assessment</h1><p class="subtitle">A plain-language summary of the checks performed on the submitted website address.</p>'+
 '<div class="meta"><div><small>Website / hostname</small><strong>'+esc(data.hostname)+'</strong></div><div><small>Assessment reference</small><strong>'+esc(data.scanId)+'</strong></div><div><small>Assessment date</small><strong>'+esc(new Date(data.scannedAt||Date.now()).toLocaleString())+'</strong></div><div><small>Assessment method</small><strong>URL pattern analysis'+(feed.status&&feed.status!=='not_configured'?' + local threat-intelligence lookup':'')+'</strong></div></div>'+
 '<section class="verdict"><div class="score">'+Number(data.score||0)+'<small>RISK INDICATOR / 100</small></div><div><h2>'+esc(assessment)+'</h2><p>Risk category: <b>'+esc(level)+'</b>. '+esc(riskText)+'</p></div></section>'+
 '<section class="section"><h2>1. What was detected ('+findings.length+')</h2>'+(findings.length?findings.map(f=>'<article class="finding"><div class="finding-head"><strong>'+esc(f.title)+'</strong><span class="tag '+esc(f.severity)+'">'+esc(f.severity)+'</span></div><p><b>Evidence:</b> '+esc(f.evidence)+'</p><p><b>Recommended action:</b> '+esc(f.recommendation)+'</p></article>').join(''):'<div class="empty">No configured warning patterns or known-feed matches were detected. This is not a safety guarantee.</div>')+'</section>'+
 '<section class="section"><h2>2. Live domain intelligence</h2><div class="empty">Provider status: '+esc(di.status||'unavailable')+'. Verdict: '+esc(dv.status||'not available')+'. '+(dv.threat?'Confirmed threat listing: '+esc(dv.matchedDomain||data.hostname)+'. ':'')+(di.assessment?'Pattern assessment: '+esc(di.assessment.risk)+' ('+Number(di.assessment.score||0)+'/'+Number(di.assessment.maxScore||100)+'). ':'')+(rg.created?'Registered: '+esc(rg.created)+'. ':'')+(rg.ageDays!==null&&rg.ageDays!==undefined?'Domain age: '+Number(rg.ageDays)+' days. ':'')+(rg.registrar?'Registrar: '+esc(rg.registrar)+'. ':'')+(inf.resolvedIps?.length?'Resolved IPs: '+esc(inf.resolvedIps.join(', '))+'. ':'')+(camp.brand?'Related campaign: '+esc(camp.brand)+'. ':'')+'Only the hostname is shared with the provider; the full URL path and query are not sent. A non-listed result is not proof of safety.</div></section>'+
 const evidenceSection='<section class="section"><h2>Independent evidence & relationship intelligence</h2><div class="empty">Status: manual verification required. The links below are investigation leads, not completed external checks.</div>'+
 (evidence.operatorNameCandidates?.length?'<div class="empty">Possible operator-name candidates: '+esc(evidence.operatorNameCandidates.join(', '))+'. Verify exact spelling and registration number independently.</div>':'<div class="empty">No explicit legal operator-name candidate was extracted from the captured page.</div>')+
 (Array.isArray(evidence.sources)?evidence.sources.map(source=>'<article class="finding"><div class="finding-head"><strong>'+esc(source.label)+'</strong><a href="'+esc(source.url)+'" target="_blank" rel="noopener noreferrer">Open source</a></div><p>'+esc(source.whatToVerify)+'</p><p><b>Status:</b> Manual review required; not checked by the scanner.</p></article>').join(''):'')+
 '<div class="empty">Provider-related domains: '+esc(relationship.relatedDomains?.join(', ')||'None returned')+'. Campaign: '+esc(relationship.campaignBrand||'Not reported')+'. Certificate co-listed names: '+esc(relationship.certificateCoNames?.join(', ')||'None returned')+'. '+esc(relationship.interpretation||'These are investigative leads, not proof of common ownership.')+'</div>'+
 (Array.isArray(evidence.limitations)?'<div class="empty">'+evidence.limitations.map(esc).join(' ')+'</div>':'')+'</section>';
 evidenceSection+advancedSection+\n '<section class="section"><h2>3. Business model & payout verification</h2><div class="empty">'+(pageData.businessSignals?.length?'Detected business signals: '+esc(pageData.businessSignals.join(', '))+'. ':'No earning-model claims were detected in the captured public content. ')+'Operator disclosure: '+(pageData.operatorDisclosure?'Legal entity '+(pageData.operatorDisclosure.legalEntityDetected?'detected':'not found in captured page')+'; contact details '+(pageData.operatorDisclosure.contactDetailsDetected?'detected':'not found in captured page')+'; Terms link '+(pageData.operatorDisclosure.termsLinkDetected?'detected':'not found in captured page')+'; Privacy link '+(pageData.operatorDisclosure.privacyLinkDetected?'detected':'not found in captured page')+'. Official company-registry verification was not performed. ':'Not available.')+' Payout status: <b>not independently verified</b>. Website statements, member counters, testimonials and payment screenshots are not independent proof that users receive money. Do not pay an activation, deposit or withdrawal fee to release supposed earnings.</div></section>'+
 '<section class="section"><h2>4. DNS & network records</h2><div class="empty">Lookup status: '+esc(dns.status||'unavailable')+'. '+(dnsData.records?.length?dnsData.records.map(r=>esc(r.type)+' · '+esc(r.value)).join('<br>'):'No DNS records were returned or the lookup was unavailable.')+'</div></section>'+
 '<section class="section"><h2>4. Live TLS certificate & chain</h2><div class="empty">Status: '+esc(tls.status||'unavailable')+'. '+(tlsData.subject?'Subject: '+esc(tlsData.subject)+'. ':'')+(tlsData.issuer?'Issuer: '+esc(tlsData.issuer)+'. ':'')+(tlsData.notBefore?'Valid from: '+esc(tlsData.notBefore)+'. ':'')+(tlsData.notAfter?'Expires: '+esc(tlsData.notAfter)+'. ':'')+(tlsData.daysUntilExpiry!==null&&tlsData.daysUntilExpiry!==undefined?'Days until expiry: '+Number(tlsData.daysUntilExpiry)+'. ':'')+(tlsData.signatureAlgorithm?'Signature: '+esc(tlsData.signatureAlgorithm)+'. ':'')+(tlsData.publicKeyAlgorithm?'Public key: '+esc(tlsData.publicKeyAlgorithm)+(tlsData.publicKeyBits?' '+Number(tlsData.publicKeyBits)+' bits':'')+'. ':'')+(tlsData.hostnameMatch===true?'Hostname coverage verified. ':tlsData.hostnameMatch===false?'Hostname mismatch: certificate does not cover the submitted hostname. ':'Hostname coverage not confirmed. ')+(tlsData.subjectAltNames?.length?'Certificate DNS names: '+tlsData.subjectAltNames.map(esc).join(', ')+'. ':'')+(tlsData.chainLength?'Chain certificates: '+Number(tlsData.chainLength)+'. ':'')+(tlsData.chainComplete===true?'Chain complete. ':tlsData.chainComplete===false?'Chain incomplete. ':'')+(tlsData.problems?.length?'Validation issues: '+tlsData.problems.map(esc).join('; '):'No validation problems were reported.')+'</div></section>'+
 '<section class="section"><h2>5. Certificate Transparency</h2><div class="empty">Status: '+esc(cert.status||'unavailable')+'. '+(certData.found===false?'No matching certificate record for this hostname was found in the registrable domain '+esc(certData.queriedDomain||live.registrableDomain||'unknown')+'. ':certData.latestIssuedAt?'Latest matching publicly logged certificate issued: '+esc(certData.latestIssuedAt)+'. Expires: '+esc(certData.latestExpiresAt||'unknown')+'. Issuer: '+esc(certData.issuer||'not supplied')+'. ':'No certificate-transparency record was available.')+'This is public certificate issuance history, not a live TLS handshake.</div></section>'+
 '<section class="section"><h2>6. Domain registration</h2><div class="empty">Status: '+esc(reg.status||'unavailable')+'. '+(regData.queriedDomain?'Domain checked: '+esc(regData.queriedDomain)+'. ':'')+(regData.createdAt?'Registered: '+esc(regData.createdAt)+'. ':'Registration date unavailable. ')+(regData.ageDays!==null&&regData.ageDays!==undefined?'Approximate age: '+Number(regData.ageDays)+' days. ':'')+(regData.registrar?'Registrar: '+esc(regData.registrar)+'. ':'')+'</div></section>'+
 '<section class="section"><h2>7. Live website content</h2><div class="empty">Status: '+esc(page.status||'unavailable')+'. '+(page.errorCode?'Provider detail: '+esc(page.errorCode)+'. ':'')+(pageData.source?'Source: '+esc(pageData.source)+'. ':'')+(pageData.httpStatus?'Page HTTP status: '+Number(pageData.httpStatus)+'. ':'')+(pageData.title?'Page title: '+esc(pageData.title)+'. ':'')+(pageData.fetchedUrl?'Final URL reported by Firecrawl: '+esc(pageData.fetchedUrl)+'. ':'')+(pageData.redirected?'A hostname change was reported by Firecrawl. ':'')+(pageData.cachedAt?'Provider cache timestamp: '+esc(pageData.cachedAt)+'. ':'')+'Content indicators: '+(pageData.indicators?.length?pageData.indicators.map(x=>esc(indicatorLabels[x]||x)).join(' · '):'No configured content indicators found')+'. '+Number(pageData.contentBytes||0)+' bytes of text inspected. This is not a malware sandbox or a complete browser security test.</div></section>'+
 '<section class="section"><h2>8. Threat-intelligence coverage</h2><div class="empty">Feed status: '+esc(feed.status||'not configured')+'. '+(Array.isArray(feed.feeds)?feed.feeds.map(f=>esc(f.source)+': '+esc(f.status)).join(' · '):'No feed details returned.')+'<br>A feed match is useful evidence; no match only means the submitted indicator was not found in the available feed snapshot.</div></section>'+
 '<section class="section"><h2>9. What you should do next</h2><div class="recommend"><b>Before interacting with this website:</b><br>Verify the exact domain through the organisation’s official website or a trusted contact channel. Do not enter passwords, one-time codes, banking details or recovery phrases when the sender or destination is unexpected. If the link came by message, confirm it with the sender using a separate channel.</div></section>'+
 '<section class="section"><h2>10. Scope and limitations</h2><ul class="limitations">'+(Array.isArray(data.limitations)?data.limitations:[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'<li>This report records the result returned at the time of assessment; website content and threat status can change.</li></ul></section>'+
 '<div class="footer"><span>SCAM DETECTOR · Created by Mr Tirrion</span><span><a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></span><span>Reference: '+esc(data.scanId)+'</span></div>';
}catch(error){root.innerHTML='<div class="error"><h2>Report unavailable</h2><p>'+esc(error.message)+'</p><p><a href="/">Return to the scanner</a></p></div>';}
</script></body></html>
