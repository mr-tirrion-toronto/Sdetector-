<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Security Assessment · Scam Detector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172536;font:14px/1.55 Inter,Arial,sans-serif}.toolbar{max-width:900px;margin:22px auto 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 18px}.toolbar button{border:0;background:#0e766e;color:white;padding:12px 17px;border-radius:9px;font-weight:700;cursor:pointer}.toolbar a{color:#40566d;text-decoration:none;font-size:12px}.sheet{width:min(850px,calc(100% - 28px));margin:0 auto 40px;background:#fff;box-shadow:0 12px 48px #17253618;padding:48px 54px;min-height:1000px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid #0e766e;padding-bottom:24px}.brand{font-size:13px;font-weight:900;letter-spacing:.12em;color:#0e766e}.brand small{display:block;font-size:9px;letter-spacing:.16em;color:#6c7f91;margin-top:4px}.report-label{text-align:right;color:#617386;font-size:10px;letter-spacing:.12em;font-weight:800}.title{margin:30px 0 8px;font-size:30px;letter-spacing:-.04em}.subtitle{color:#65778a;margin:0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.meta div{background:#f3f7f8;padding:13px 15px;border-radius:8px;min-width:0}.meta small{display:block;color:#6c7e8f;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.meta strong{display:block;margin-top:4px;overflow-wrap:anywhere;font-size:12px}.verdict{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;padding:20px;border:1px solid #dce5e9;border-radius:12px;margin:20px 0}.score{font-size:35px;font-weight:900;letter-spacing:-.05em;color:#0e766e}.score small{display:block;font-size:9px;letter-spacing:.12em;color:#65778a}.verdict h2{margin:0 0 5px;font-size:17px}.verdict p{margin:0;color:#65778a;font-size:12px}.section{margin-top:28px}.section h2{font-size:14px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #e1e8ed}.finding{padding:13px 0;border-bottom:1px solid #edf1f4}.finding:last-child{border-bottom:0}.finding-head{display:flex;justify-content:space-between;gap:12px}.finding strong{font-size:12px}.tag{font-size:9px;text-transform:uppercase;font-weight:800;letter-spacing:.08em;border-radius:20px;padding:3px 8px;background:#edf2f6;color:#52677b;white-space:nowrap}.tag.high{background:#fff0f1;color:#b52c42}.tag.medium{background:#fff6e6;color:#9a6514}.tag.low{background:#eef5ff;color:#38689f}.finding p{font-size:11px;color:#52677b;margin:5px 0}.finding b{color:#263d50}.empty{font-size:12px;color:#64788b;background:#f6f8fa;padding:14px;border-radius:8px}.recommend{background:#edf7f5;border-left:3px solid #0e766e;padding:15px 17px;border-radius:7px;color:#355d59;font-size:12px}.limitations{font-size:10px;color:#687b8d;padding-left:18px}.footer{margin-top:40px;padding-top:16px;border-top:1px solid #dfe6eb;display:flex;justify-content:space-between;gap:15px;color:#8090a0;font-size:9px}.error{padding:50px 0;text-align:center;color:#53677b}
@media(max-width:600px){.sheet{padding:28px 22px}.title{font-size:24px}.verdict{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.toolbar{align-items:flex-start}.top{flex-direction:column}.report-label{text-align:left}}
@page{size:A4;margin:14mm}@media print{body{background:#fff}.toolbar{display:none}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}.finding,.meta div,.verdict,.recommend{break-inside:avoid}.section{break-inside:avoid}.footer{position:static}}
</style></head><body>
<div class="toolbar"><a href="/">← Return to Scam Detector</a><button onclick="window.print()">Print / Save as PDF</button></div>
<main class="sheet" id="report"><div class="error">Preparing your security assessment…</div></main>
<script>
const root=document.getElementById('report');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={known_threat_detected:'Known threat match',no_known_threat_match:'No known threat match',threat_intel_partial:'Partial threat intelligence',threat_intel_unavailable:'Threat intelligence unavailable',insufficient_evidence:'Insufficient evidence',preliminary_signals_detected:'Preliminary URL signals detected'};
try{
 const data=JSON.parse(sessionStorage.getItem('scamDetectorReport')||'null');
 if(!data)throw new Error('No report data was found. Return to the scanner and generate a new report.');
 const findings=Array.isArray(data.findings)?data.findings:[];
 const assessment=labels[data.assessmentStatus]||'Preliminary assessment';
 const level=String(data.riskLevel||'unknown').toUpperCase();
 const riskText=data.assessmentStatus==='known_threat_detected'?'A matching indicator was found in a configured threat-intelligence source. Do not visit or interact with this website.':data.assessmentStatus==='no_known_threat_match'?'No exact match was found in the configured threat feeds. This does not prove the website is safe.':'The scanner found URL-pattern evidence only. This assessment is not a definitive verdict.';
 const feed=data.threatIntelligence||{};
 const di=data.domainIntelligence||{};
 const dv=di.verdict||{};
 const rg=di.registration||{};
 const inf=di.infrastructure||{};
 const camp=di.campaign||{};
 root.innerHTML='<div class="top"><div class="brand">SCAM DETECTOR<small>WEBSITE RISK INTELLIGENCE</small></div><div class="report-label">SECURITY ASSESSMENT<br>CONFIDENTIAL · USER-GENERATED</div></div>'+
 '<h1 class="title">Website Security Assessment</h1><p class="subtitle">A plain-language summary of the checks performed on the submitted website address.</p>'+
 '<div class="meta"><div><small>Website / hostname</small><strong>'+esc(data.hostname)+'</strong></div><div><small>Assessment reference</small><strong>'+esc(data.scanId)+'</strong></div><div><small>Assessment date</small><strong>'+esc(new Date(data.scannedAt||Date.now()).toLocaleString())+'</strong></div><div><small>Assessment method</small><strong>URL pattern analysis'+(feed.status&&feed.status!=='not_configured'?' + local threat-intelligence lookup':'')+'</strong></div></div>'+
 '<section class="verdict"><div class="score">'+Number(data.score||0)+'<small>RISK INDICATOR / 100</small></div><div><h2>'+esc(assessment)+'</h2><p>Risk category: <b>'+esc(level)+'</b>. '+esc(riskText)+'</p></div></section>'+
 '<section class="section"><h2>1. What was detected ('+findings.length+')</h2>'+(findings.length?findings.map(f=>'<article class="finding"><div class="finding-head"><strong>'+esc(f.title)+'</strong><span class="tag '+esc(f.severity)+'">'+esc(f.severity)+'</span></div><p><b>Evidence:</b> '+esc(f.evidence)+'</p><p><b>Recommended action:</b> '+esc(f.recommendation)+'</p></article>').join(''):'<div class="empty">No configured warning patterns or known-feed matches were detected. This is not a safety guarantee.</div>')+'</section>'+
 '<section class="section"><h2>2. Live domain intelligence</h2><div class="empty">Provider status: '+esc(di.status||'unavailable')+'. Verdict: '+esc(dv.status||'not available')+'. '+(dv.threat?'Confirmed threat listing: '+esc(dv.matchedDomain||data.hostname)+'. ':'')+(di.assessment?'Pattern assessment: '+esc(di.assessment.risk)+' ('+Number(di.assessment.score||0)+'/'+Number(di.assessment.maxScore||100)+'). ':'')+(rg.created?'Registered: '+esc(rg.created)+'. ':'')+(rg.ageDays!==null&&rg.ageDays!==undefined?'Domain age: '+Number(rg.ageDays)+' days. ':'')+(rg.registrar?'Registrar: '+esc(rg.registrar)+'. ':'')+(inf.resolvedIps?.length?'Resolved IPs: '+esc(inf.resolvedIps.join(', '))+'. ':'')+(camp.brand?'Related campaign: '+esc(camp.brand)+'. ':'')+'Only the hostname is shared with the provider; the full URL path and query are not sent. A non-listed result is not proof of safety.</div></section>'+
 '<section class="section"><h2>3. Threat-intelligence coverage</h2><div class="empty">Feed status: '+esc(feed.status||'not configured')+'. '+(Array.isArray(feed.feeds)?feed.feeds.map(f=>esc(f.source)+': '+esc(f.status)).join(' · '):'No feed details returned.')+'<br>A feed match is useful evidence; no match only means the submitted indicator was not found in the available feed snapshot.</div></section>'+
 '<section class="section"><h2>4. What you should do next</h2><div class="recommend"><b>Before interacting with this website:</b><br>Verify the exact domain through the organisation’s official website or a trusted contact channel. Do not enter passwords, one-time codes, banking details or recovery phrases when the sender or destination is unexpected. If the link came by message, confirm it with the sender using a separate channel.</div></section>'+
 '<section class="section"><h2>5. Scope and limitations</h2><ul class="limitations">'+(Array.isArray(data.limitations)?data.limitations:[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'<li>This report records the result returned at the time of assessment; website content and threat status can change.</li></ul></section>'+
 '<div class="footer"><span>SCAM DETECTOR · Created by Mr Tirrion</span><span>Reference: '+esc(data.scanId)+'</span></div>';
}catch(error){root.innerHTML='<div class="error"><h2>Report unavailable</h2><p>'+esc(error.message)+'</p><p><a href="/">Return to the scanner</a></p></div>';}
</script></body></html>
